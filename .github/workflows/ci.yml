name: CI

on:
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: RocketPadPlatforms/github-actions/actions/opentofu-fmt-check@v1

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: RocketPadPlatforms/github-actions/actions/opentofu-validate@v1
